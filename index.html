<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cyber AI — Intelligence Beyond The Interface</title>
<meta name="description" content="Cyber AI. Intelligence beyond the interface.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23111%22 stroke=%22%23C7C7C7%22 stroke-width=%222%22/></svg>">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="topbar.css">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="attachments.css">
<link rel="stylesheet" href="preview.css">
<link rel="stylesheet" href="animations.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>

<div class="app-shell">

  <!-- =========================================================
       SIDEBAR
       ========================================================= -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <span class="logo-mark" id="logo-mark-sidebar"></span>
        <div class="logo-wordmark">
          CYBER<span class="chrome-text"> AI</span>
          <span class="sub">INTELLIGENCE BEYOND THE INTERFACE</span>
        </div>
      </div>
      <button class="new-chat-btn" id="btn-new-chat" type="button">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        New Chat
      </button>
    </div>

    <div class="sidebar-search">
      <span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input type="text" id="search-chats" placeholder="Search conversations">
    </div>

    <nav class="sidebar-scroll" id="conversation-list" aria-label="Conversation history"></nav>

    <div class="sidebar-foot">
      <button class="sidebar-foot-item" id="btn-open-models" type="button">
        <span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>
        Models
      </button>
      <button class="sidebar-foot-item" id="btn-open-api" type="button">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg></span>
        API
      </button>
      <button class="sidebar-foot-item" id="btn-open-settings" type="button">
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg></span>
        Settings
      </button>
      <button class="sidebar-foot-item" id="btn-open-about" type="button">
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg></span>
        About Cyber AI
      </button>
    </div>
  </aside>

  <!-- =========================================================
       MAIN COLUMN
       ========================================================= -->
  <div class="main-col">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="btn-menu-toggle" type="button" aria-label="Open menu">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
        </button>

        <button class="model-pill" id="btn-model-pill" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="model-pill-icon" id="model-pill-icon"></span>
          <span class="model-pill-info">
            <span class="model-pill-name" id="model-pill-name">CYBER AI</span>
            <span class="model-pill-meta">
              <span class="status-dot" id="model-pill-status"></span>
              <span id="model-pill-provider">Select a provider</span>
            </span>
          </span>
          <span class="icon chevron"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>

        <div class="model-dropdown" id="model-dropdown" role="menu"></div>
      </div>

      <div class="topbar-right">
        <span class="web-search-indicator" id="web-search-indicator">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
          WEB SEARCH ACTIVE
        </span>
        <button class="topbar-icon-btn" id="btn-topbar-settings" type="button" aria-label="Settings">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg></span>
        </button>
      </div>
    </header>

    <!-- WELCOME SCREEN -->
    <div class="welcome-screen" id="welcome-screen">
      <span class="logo-mark welcome-logo" id="logo-mark-welcome"></span>
      <h1 class="welcome-title chrome-text">CYBER AI</h1>
      <p class="welcome-tagline">INTELLIGENCE BEYOND THE INTERFACE</p>
      <p class="welcome-prompt" id="welcome-prompt">What can I help you build?</p>

      <div class="quick-actions" id="quick-actions">
        <button class="quick-action-btn" data-prompt="Write Code" data-model="codex" type="button">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg></span>
          Write Code
        </button>
        <button class="quick-action-btn" data-prompt="Design UI" data-model="codex" type="button">
          <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></span>
          Design UI
        </button>
        <button class="quick-action-btn" data-prompt="Debug" data-model="codex" type="button">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6"/><path d="M12 7V4M9 4h6M9 21l1.5-3M15 21l-1.5-3M4 12H2M22 12h-2M5 8l-2-2M19 8l2-2"/></svg></span>
          Debug
        </button>
        <button class="quick-action-btn" data-prompt="Explain" data-model="vibe" type="button">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg></span>
          Explain
        </button>
        <button class="quick-action-btn" data-prompt="Brainstorm" data-model="vibe" type="button">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.6.55 1 1.3 1 2.5h6c0-1.2.4-1.95 1-2.5A6 6 0 0012 3z"/></svg></span>
          Brainstorm
        </button>
        <button class="quick-action-btn" data-prompt="Solve" data-model="riddle" type="button">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M9.5 9a2.5 2.5 0 015 0c0 1.5-2 2-2.5 3.5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></span>
          Solve
        </button>
        <button class="quick-action-btn" data-prompt="Tell Me A Riddle" data-model="riddle" type="button">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 4l2.4 5.2L20 10l-4 3.9.9 5.6-4.9-2.7-4.9 2.7.9-5.6-4-3.9 5.6-.8z"/></svg></span>
          Tell Me A Riddle
        </button>
      </div>

      <div class="welcome-no-provider" id="welcome-no-provider" style="display:none;">
        <p>No AI provider configured</p>
        <button class="btn-chrome-sm" id="btn-configure-provider" type="button" style="flex:none; padding:9px 18px;">
          Configure Provider
        </button>
      </div>
    </div>

    <!-- CHAT SCROLL AREA -->
    <div class="chat-scroll" id="chat-scroll" style="display:none;">
      <div class="chat-inner" id="chat-inner"></div>
    </div>

    <!-- INPUT REGION -->
    <div class="input-region" id="input-region">
      <div class="dropzone-overlay" id="dropzone-overlay">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></span>
        <span>Drop files to attach</span>
      </div>
      <div class="input-shell">
        <div class="input-toolbar">
          <button class="toggle-chip" id="chip-web-search" type="button" aria-pressed="false">
            <span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
            Web Search
          </button>
          <button class="toggle-chip" id="chip-thinking" type="button" aria-pressed="false">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.6.55 1 1.3 1 2.5h6c0-1.2.4-1.95 1-2.5A6 6 0 0012 3z"/></svg></span>
            Extended Thinking
          </button>
        </div>

        <div class="attachment-tray" id="attachment-tray"></div>

        <div class="input-box">
          <input type="file" id="file-input" multiple hidden
                 accept="image/png,image/jpeg,image/gif,image/webp,.pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.php,.cpp,.c">
          <button class="input-attach-btn" id="btn-attach" type="button" aria-label="Attach file or photo">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/></svg></span>
          </button>
          <textarea id="chat-input" placeholder="Ask Cyber AI anything..." rows="1"></textarea>
          <button class="send-btn" id="btn-send" type="button" aria-label="Send message" disabled>
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></span>
          </button>
        </div>

        <div class="input-hint">
          <span><kbd>Ctrl</kbd> / <kbd>Cmd</kbd> + <kbd>Enter</kbd> to send</span>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- =========================================================
     SETTINGS PANEL
     ========================================================= -->
<div class="settings-overlay" id="settings-overlay">
  <div class="settings-panel" id="settings-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="settings-head">
      <span class="settings-title" id="settings-panel-title">Settings</span>
      <button class="settings-close" id="btn-close-settings" type="button" aria-label="Close settings">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
      </button>
    </div>
    <div class="settings-tabs">
      <button class="settings-tab active" data-tab="providers" type="button">AI Providers</button>
      <button class="settings-tab" data-tab="general" type="button">General</button>
      <button class="settings-tab" data-tab="about" type="button">About</button>
    </div>
    <div class="settings-body" id="settings-body"></div>
  </div>
</div>

<!-- =========================================================
     PREVIEW PANEL (live code canvas)
     ========================================================= -->
<div class="preview-panel" id="preview-panel">
  <div class="preview-resize-handle" id="preview-resize-handle"></div>
  <div class="preview-head">
    <div class="preview-head-left">
      <span class="preview-head-icon"><svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg></span>
      <span class="preview-title" id="preview-title">Preview</span>
    </div>
    <div class="preview-tabs">
      <button class="preview-tab active" data-preview-tab="render" type="button">Preview</button>
      <button class="preview-tab" data-preview-tab="code" type="button">Code</button>
    </div>
    <div class="preview-head-actions">
      <button class="preview-icon-btn" id="btn-preview-refresh" type="button" aria-label="Refresh preview">
        <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.5 9A9 9 0 003.6 6.4M3.5 15a9 9 0 0016.9 2.6"/></svg>
      </button>
      <button class="preview-icon-btn" id="btn-preview-newtab" type="button" aria-label="Open in new tab">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
      </button>
      <button class="preview-icon-btn" id="btn-preview-close" type="button" aria-label="Close preview">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="preview-body" id="preview-body">
    <div class="preview-empty-state" id="preview-empty-state">
      <svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/></svg>
      <p>Nothing to preview yet</p>
    </div>
    <iframe id="preview-iframe" title="Live preview" sandbox="allow-scripts allow-modals allow-forms allow-popups" style="display:none;"></iframe>
    <div class="preview-code-view" id="preview-code-view"><pre id="preview-code-text"></pre></div>
    <div class="preview-error-banner" id="preview-error-banner">
      <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L2.5 18a2 2 0 001.7 3h15.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      <span id="preview-error-text"></span>
    </div>
  </div>
</div>

<!-- Lightbox for image attachments -->
<div class="lightbox-overlay" id="lightbox-overlay">
  <button class="lightbox-close" id="btn-lightbox-close" type="button" aria-label="Close image">
    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightbox-img" src="" alt="Attachment preview">
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="storage.js"></script>
<script src="models.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script src="animations.js"></script>
<script src="chat.js"></script>
<script src="attachments.js"></script>
<script src="preview.js"></script>
<script src="app.js"></script>
</body>
</html>
